<style>
:root{
  --ink:#0b0d12;
  --gold:#e8c57c;--gold-hi:#f4dca8;--gold-deep:#a8823f;
  --paper:#f3ead6;--mist:#8a8778;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);
  font-family:'Chakra Petch','Microsoft YaHei',system-ui,sans-serif;
  overflow-x:hidden;position:relative;
}
.mono{font-family:Consolas,'Courier New',monospace}

/* ===== 场景背景（程序化，无图片） ===== */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene .vortex{
  position:absolute;left:50%;top:44%;width:140vmax;height:90vmax;transform:translate(-50%,-50%);
  background:
    radial-gradient(ellipse 32% 26% at 50% 50%,rgba(232,197,124,.20),transparent 70%),
    radial-gradient(ellipse 55% 40% at 50% 52%,rgba(160,100,50,.12),transparent 72%),
    radial-gradient(ellipse 80% 60% at 50% 55%,rgba(70,40,20,.20),transparent 75%);
  filter:blur(6px);
  animation:vortexDrift 26s ease-in-out infinite alternate;
}
@keyframes vortexDrift{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  100%{transform:translate(-48%,-52%) scale(1.12) rotate(2.2deg)}
}
.scene .beams{
  position:absolute;inset:-20%;
  background:
    conic-gradient(from 200deg at 62% 38%,transparent 0deg,rgba(232,197,124,.05) 14deg,transparent 30deg),
    conic-gradient(from 20deg at 30% 60%,transparent 0deg,rgba(199,74,69,.045) 18deg,transparent 36deg);
  animation:beamsSway 34s ease-in-out infinite alternate;
}
@keyframes beamsSway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.scene .ground{
  position:absolute;left:0;right:0;bottom:0;height:26vh;
  background:linear-gradient(180deg,transparent,rgba(5,6,9,.92) 55%);
}
.cityline{position:absolute;left:0;right:0;bottom:10vh;width:100%;opacity:.5}
.cityline svg{width:100%;height:9vh;display:block}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background-image:repeating-conic-gradient(rgba(255,255,255,.6) 0 .0002%,transparent 0 .0004%);
  mix-blend-mode:overlay}

/* ===== 顶标 ===== */
.brand{position:fixed;left:34px;top:26px;z-index:20;display:flex;align-items:center;gap:11px}
.brand svg{width:34px;height:34px}
.brand .bt{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;letter-spacing:.2em;color:var(--paper)}
.brand .bt em{font-style:normal;color:var(--gold)}
.brand .bs{font-size:9px;color:var(--mist);letter-spacing:.34em;margin-top:2px}

/* ===== 右上：进入仓库 ===== */
.enter{
  position:fixed;right:34px;top:30px;z-index:20;display:flex;align-items:center;gap:10px;
  font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.24em;color:var(--paper);
  border:1px solid rgba(232,197,124,.55);padding:9px 20px;background:rgba(10,11,15,.45);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:.25s;text-decoration:none;
}
.enter:hover{background:rgba(232,197,124,.16);border-color:var(--gold)}
.enter b{color:var(--gold);font-weight:400}

/* ===== 左下挂牌 ===== */
.plate{
  position:fixed;left:34px;bottom:38px;z-index:20;
  border:1.5px solid rgba(232,197,124,.5);padding:9px 14px;text-align:center;
  background:rgba(10,11,15,.5);font-family:Consolas,monospace;
}
.plate .big{font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.plate .small{font-size:8.5px;color:var(--mist);letter-spacing:.3em;margin-top:2px}

/* ===== 右下浮窗 ===== */
.lobby{
  position:fixed;right:34px;bottom:38px;z-index:20;display:flex;align-items:center;gap:12px;
  background:rgba(10,11,15,.62);border:1px solid rgba(255,255,255,.12);
  padding:12px 18px;text-decoration:none;transition:.25s;
}
.lobby:hover{border-color:rgba(232,197,124,.55)}
.lobby .avi{width:42px;height:42px;border:1px solid rgba(232,197,124,.5);display:grid;place-items:center;
  font-family:'Chakra Petch';font-weight:700;color:var(--gold);font-size:15px}
.lobby .lt{font-size:11px;color:var(--paper);letter-spacing:.14em}
.lobby .ls{font-size:9px;color:var(--mist);letter-spacing:.2em;margin-top:2px}

/* ===== 主视觉 ===== */
.kv{
  position:relative;z-index:10;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:90px 20px 120px;
}
.kv .kicker{
  font-family:Consolas,monospace;font-size:clamp(10px,1.2vw,13px);color:var(--mist);
  letter-spacing:.6em;text-indent:.6em;margin-bottom:4vh;
}
.kicker b{color:var(--gold);font-weight:400}
.slogan{
  font-weight:700;
  font-size:clamp(42px,8.4vw,118px);line-height:1.18;letter-spacing:.06em;
  color:var(--paper);text-shadow:0 4px 40px rgba(0,0,0,.8),0 0 80px rgba(232,197,124,.14);
}
.slogan .g{
  background:linear-gradient(120deg,#f4dca8 0%,#e8c57c 45%,#c9a063 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
}
.slogan-row{display:block}
.slogan-row + .slogan-row{margin-top:.08em}
.tagline{
  margin-top:3.2vh;
  font-family:'Chakra Petch',sans-serif;
  font-size:clamp(14px,1.8vw,20px);letter-spacing:.5em;text-indent:.5em;color:var(--paper);opacity:.92;
}
.tagline em{font-style:normal;color:var(--gold)}
.date-tag{
  margin-top:1.6vh;
  font-family:Consolas,monospace;font-size:clamp(11px,1.3vw,14px);color:var(--mist);letter-spacing:.34em;
}
.date-tag b{color:var(--gold);font-weight:400}

/* 双 CTA（中式装饰边框） */
.cta-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:5.5vh}
.cta{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-width:min(300px,80vw);padding:17px 40px;text-decoration:none;
  font-family:'Chakra Petch',sans-serif;font-size:clamp(14px,1.5vw,17px);letter-spacing:.42em;text-indent:.42em;
  color:var(--gold-hi);
  background:linear-gradient(180deg,rgba(30,25,14,.72),rgba(12,12,10,.72));
  border:1px solid rgba(232,197,124,.75);
  box-shadow:inset 0 0 0 1px rgba(20,18,10,.9),inset 0 0 24px rgba(232,197,124,.07);
  transition:.3s;
}
.cta::before,.cta::after{
  content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--gold);
  transition:.3s;
}
.cta::before{left:-4px;top:-4px;border-right:none;border-bottom:none}
.cta::after{right:-4px;bottom:-4px;border-left:none;border-top:none}
.cta .orn{color:var(--gold-deep);font-size:11px;letter-spacing:0;text-indent:0;opacity:.85}
.cta:hover{
  background:linear-gradient(180deg,rgba(58,46,20,.85),rgba(26,22,12,.85));
  border-color:var(--gold-hi);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(20,18,10,.9),inset 0 0 34px rgba(232,197,124,.14),0 10px 40px rgba(0,0,0,.6);
}
.cta:hover::before,.cta:hover::after{width:13px;height:13px}
.cta.ghost{color:var(--paper)}
.cta.ghost:hover{color:var(--gold-hi)}

/* 底部滚动跑马灯：微缩作品条 */
.reel{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  border-top:1px solid rgba(232,197,124,.25);background:rgba(8,9,12,.55);backdrop-filter:blur(6px);
  overflow:hidden;padding:10px 0;
}
.reel-track{display:flex;gap:0;width:max-content;animation:reel 36s linear infinite}
.reel:hover .reel-track{animation-play-state:paused}
.reel a{
  display:inline-flex;align-items:center;gap:10px;padding:2px 26px;text-decoration:none;
  font-family:Consolas,monospace;font-size:11.5px;color:var(--mist);letter-spacing:.2em;white-space:nowrap;
  transition:color .2s;
}
.reel a:hover{color:var(--gold)}
.reel a b{color:var(--paper);font-weight:400}
.reel .d{color:var(--gold-deep)}
@keyframes reel{to{transform:translateX(-50%)}}

/* 响应式 */
@media (max-width:760px){
  .brand{left:18px;top:16px}
  .enter{right:18px;top:18px;padding:8px 14px;font-size:10.5px;letter-spacing:.14em}
  .plate{left:18px;bottom:64px}
  .lobby{right:18px;bottom:64px}
  .cta-row{gap:14px}
  .cta{min-width:min(280px,86vw);padding:15px 22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

    {n:'safeyolo',d:'YOLO · CV · ★5',u:'https://github.com/ponm3ay/safeyolo'},
    {n:'dsh-plugins',d:'DSH 插件 ×5',u:'https://github.com/ponm3ay/dsh-plugins'},
    {n:'autoclaw-proxy',d:'GLM 反代',u:'https://github.com/ponm3ay/autoclaw-proxy'},
    {n:'afygbot',d:'数据层',u:'https://github.com/ponm3ay/dsh-bilibili-afygbot'},
    {n:'trae-patcher',d:'IDE 补丁',u:'https://github.com/ponm3ay/trae-cn-patcher'},
    {n:'auto-checkin',d:'自动签到',u:'https://github.com/ponm3ay/traework-auto-checkin'},
    {n:'aux-models',d:'模型槽位',u:'https://github.com/ponm3ay/dsh-aux-models'},
    {n:'provider-accent',d:'供应商染色',u:'https://github.com/ponm3ay/dsh-provider-accent'}
  ];
  var half=items.map(function(it){return '<a href="'+it.u+'" target="_blank" rel="noopener"><b>'+it.n+'</b><span class="d">◆</span>'+it.d+'</a>'}).join('');
  document.getElementById('reelTrack').innerHTML=half+half;
})();

/* 金尘粒子（canvas，22 颗低密度） */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('dust'),ctx=cv.getContext('2d');
  var W,H,P=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  size();addEventListener('resize',size);
  for(var i=0;i<22;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.5,s:Math.random()*.22+.06,o:Math.random()*.5+.2,ph:Math.random()*6.28});
  function tick(t){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];p.y-=p.s;p.x+=Math.sin(t/2400+p.ph)*.16;
      if(p.y<-8){p.y=H+8;p.x=Math.random()*W}
      var a=p.o*(.55+.45*Math.sin(t/900+p.ph));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle='rgba(232,197,124,'+a.toFixed(2)+')';ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
